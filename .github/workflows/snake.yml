name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: generate branded snake (light + dark)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: fancyism
          outputs: |
            dist/snake.svg?color_snake=%23D61723&color_dots=%23E7EAEE,%23CDD3DA,%23AFB8C1,%238C959F,%236E7681
            dist/snake-dark.svg?color_snake=%23D61723&color_dots=%231C2330,%232D3748,%23484F53,%236E7681,%238B949E

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
