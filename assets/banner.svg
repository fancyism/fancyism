<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Segoe UI, Tahoma, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="6" y="6" width="888" height="248" rx="14" fill="none" stroke="#2d3748" stroke-width="2"/>

  <circle cx="70" cy="70" r="4" fill="#f97316">
    <animate attributeName="cx" values="60;840;60" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;200;60" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="200" r="3" fill="#3b82f6">
    <animate attributeName="cx" values="840;60;840" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;70;210" dur="13s" repeatCount="indefinite"/>
  </circle>

  <circle cx="42" cy="42" r="6" fill="#ef4444"/>
  <circle cx="62" cy="42" r="6" fill="#fbbf24"/>
  <circle cx="82" cy="42" r="6" fill="#22c55e"/>

  <text x="60" y="118" font-size="44" font-weight="700" fill="url(#accent)">Fan Affan</text>
  <text x="60" y="152" font-size="20" fill="#e6edf3">indie dev × AI agents — สร้าง bots ให้ทำงานแทนตัวเอง</text>

  <text x="60" y="192" font-size="16" fill="#8b949e" font-family="Consolas, monospace">
    &gt; กำลังเขียน: agent skills · MCP tools · automation ที่รันเองทุกวัน
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <rect x="62" y="206" width="12" height="18" fill="#f97316">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <g font-size="12" fill="#9ca3af">
    <rect x="60" y="222" width="96" height="24" rx="12" fill="#1c2330" stroke="#2d3748"/>
    <text x="108" y="238" text-anchor="middle">🇹🇭 Thailand</text>
    <rect x="164" y="222" width="120" height="24" rx="12" fill="#1c2330" stroke="#2d3748"/>
    <text x="224" y="238" text-anchor="middle">ship daily 🚀</text>
    <rect x="292" y="222" width="150" height="24" rx="12" fill="#1c2330" stroke="#2d3748"/>
    <text x="367" y="238" text-anchor="middle">MCP · automation</text>
  </g>
</svg>
