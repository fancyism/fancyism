<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240" font-family="'Segoe UI','Noto Sans Thai',Tahoma,system-ui,sans-serif" role="img" aria-labelledby="fa-masthead-title fa-masthead-desc">
  <title id="fa-masthead-title">Fan Affan builds AI agents</title>
  <desc id="fa-masthead-desc">Masthead for a developer profile: a happy pixel-art agent mascot with a smile, waving, beside the headline, positioning lines, and a spec column listing stack, focus and shipping cadence.</desc>
  <!--
    Fan Affan — profile masthead v4 "pixel-agent, happy"
    Brief: Swiss x Engineering Spec Sheet, amplified (bolder + happy feels) | Tier: PREMIUM | Mode: image-source
    Tokens: ink #20272F / paper #FCFDFE / dark-bg #161B22 / dark-ink #F3F5F7 / accent #D61723
            hairline #E7EAEE (light) / #2D3748 (dark) | pixel unit 8px
    Motion contract: hero = mascot idle hop (steps(), authentic 8-bit frame change);
    subordinate = eye blink + arm wave (2-frame pixel swap). Entrance = underline draw (one-shot).
    Static pose = mascot grounded, smiling, arm mid-wave, underline complete.
    Layout guard: left-column text must end < x=620 (divider 640). Measured via getBBox.
    Self-themes via prefers-color-scheme. Honors prefers-reduced-motion.
  -->
  <style>
    :root {
      --fa-duration: 900ms;
      --fa-easing: cubic-bezier(.22,1,.36,1);
      --fa-hop-period: 1100ms;
      --fa-blink-period: 3200ms;
      --fa-wave-period: 700ms;
    }
    .fa-bg    { fill: #FCFDFE; }
    .fa-name  { fill: #20272F; }
    .fa-sub   { fill: #484C53; }
    .fa-body  { fill: #25303B; }
    .fa-muted { fill: #6B7280; }
    .fa-spec  { fill: #484C53; }
    .fa-speck { fill: #20272F; }
    .fa-rule  { stroke: #E7EAEE; }
    .fa-ink   { fill: #20272F; }
    .fa-grid  { fill: #E7EAEE; opacity: .45; }
    .fa-shadow{ fill: #E7EAEE; opacity: .8; }
    @media (prefers-color-scheme: dark) {
      .fa-bg    { fill: #161B22; }
      .fa-name  { fill: #F3F5F7; }
      .fa-sub   { fill: #B6BEC9; }
      .fa-body  { fill: #D7DDE4; }
      .fa-muted { fill: #8B949E; }
      .fa-spec  { fill: #B6BEC9; }
      .fa-speck { fill: #F3F5F7; }
      .fa-rule  { stroke: #2D3748; }
      .fa-ink   { fill: #D7DDE4; }
      .fa-grid  { fill: #2D3748; opacity: .5; }
      .fa-shadow{ fill: #2D3748; opacity: .9; }
    }
    .fa-hop {
      transform-box: fill-box; transform-origin: center;
      animation: fa-hop var(--fa-hop-period) steps(1,end) infinite;
    }
    .fa-eyes {
      animation: fa-eyes var(--fa-blink-period) steps(1,end) infinite;
    }
    .fa-arm   { animation: fa-arm   var(--fa-wave-period) steps(1,end) infinite; }
    .fa-arm-b { animation: fa-arm-b var(--fa-wave-period) steps(1,end) infinite; }
    .fa-underline {
      stroke: #D61723; stroke-width: 3; stroke-linecap: butt;
      stroke-dasharray: 340; stroke-dashoffset: 340;
      animation: fa-draw var(--fa-duration) var(--fa-easing) 250ms forwards;
    }
    @keyframes fa-hop   { 0%, 42% { transform: translateY(0); } 43%, 88% { transform: translateY(-8px); } 89%, 100% { transform: translateY(0); } }
    @keyframes fa-eyes  { 0%, 92%  { opacity: 1; } 93%, 96% { opacity: 0; } 97%, 100% { opacity: 1; } }
    @keyframes fa-arm   { 0%, 49%  { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes fa-arm-b { 0%, 49%  { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes fa-draw  { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fa-hop, .fa-eyes, .fa-arm, .fa-arm-b, .fa-underline { animation: none; }
      .fa-arm-b { opacity: 0; }
      .fa-underline { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <pattern id="fa-pixgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect class="fa-grid" x="0" y="0" width="2" height="2"/>
    </pattern>
  </defs>

  <rect class="fa-bg" width="940" height="240"/>
  <rect fill="url(#fa-pixgrid)" width="940" height="240"/>

  <!-- label -->
  <text class="fa-muted" x="36" y="40" font-size="12" letter-spacing="3" font-weight="600">FAN AFFAN</text>
  <rect x="36" y="52" width="24" height="2" fill="#D61723"/>

  <!-- pixel agent mascot (grid u=8, box 44..108 x 68..164 y) -->
  <g shape-rendering="crispEdges">
    <!-- ground shadow -->
    <rect class="fa-shadow" x="48" y="158" width="56" height="6" rx="1"/>
    <!-- mascot body: hops as one unit -->
    <g class="fa-hop">
      <!-- antenna -->
      <rect fill="#D61723" x="72" y="68" width="8" height="8"/>
      <rect class="fa-ink" x="72" y="76" width="8" height="8"/>
      <!-- head -->
      <rect class="fa-ink" x="52" y="84" width="48" height="32"/>
      <!-- eyes (blink) -->
      <g class="fa-eyes" fill="#D61723">
        <rect x="62" y="94" width="8" height="8"/>
        <rect x="82" y="94" width="8" height="8"/>
      </g>
      <!-- smile -->
      <g fill="#D61723">
        <rect x="64" y="104" width="4" height="4"/>
        <rect x="68" y="108" width="16" height="4"/>
        <rect x="84" y="104" width="4" height="4"/>
      </g>
      <!-- waving arm: 2-frame pixel swap (up / down) -->
      <rect class="fa-arm" fill="#D61723" x="44" y="92" width="8" height="20"/>
      <rect class="fa-arm" fill="#D61723" x="36" y="84" width="8" height="8"/>
      <rect class="fa-arm-b" fill="#D61723" x="44" y="120" width="8" height="20"/>
      <!-- neck + body -->
      <rect class="fa-ink" x="68" y="116" width="16" height="4"/>
      <rect class="fa-ink" x="52" y="120" width="48" height="28"/>
      <!-- chest core -->
      <rect fill="#D61723" x="68" y="128" width="16" height="8"/>
      <!-- feet -->
      <rect class="fa-ink" x="56" y="148" width="12" height="8"/>
      <rect class="fa-ink" x="84" y="148" width="12" height="8"/>
    </g>
    <!-- sparkles (static) -->
    <g fill="#D61723" opacity=".85">
      <rect x="112" y="64" width="4" height="4"/>
      <rect x="116" y="68" width="4" height="4"/>
      <rect x="108" y="68" width="4" height="4"/>
      <rect x="112" y="72" width="4" height="4"/>
      <rect x="30" y="60" width="4" height="4"/>
    </g>
  </g>

  <!-- headline block (guard: all lines end < 620) -->
  <text class="fa-name" x="140" y="118" font-size="56" font-weight="700" letter-spacing="-1">Builds AI agents.</text>
  <line class="fa-underline" x1="141" y1="132" x2="481" y2="132"/>

  <text class="fa-sub" x="140" y="166" font-size="16.5" font-weight="600">One developer in Bangkok. A team of agents in production.</text>
  <text class="fa-body" x="140" y="192" font-size="14">MCP tools, automations and systems that ship while I sleep</text>

  <text class="fa-muted" x="140" y="222" font-size="12.5">open to work · remote-friendly · Bangkok (UTC+7)</text>

  <!-- spec column -->
  <line class="fa-rule" x1="640" y1="36" x2="640" y2="204" stroke-width="1"/>
  <g font-size="13" font-family="Consolas,Menlo,monospace">
    <text class="fa-muted" x="664" y="60" font-size="11" letter-spacing="2">SPEC</text>
    <text class="fa-speck" x="664" y="86" font-weight="700">stack</text>
    <text class="fa-spec" x="664" y="104">TypeScript · Python · Node</text>
    <text class="fa-speck" x="664" y="134" font-weight="700">focus</text>
    <text class="fa-spec" x="664" y="152">agent skills · MCP · automation</text>
    <text class="fa-speck" x="664" y="182" font-weight="700">shipping</text>
    <text class="fa-spec" x="664" y="200">daily, since Dec 2023</text>
  </g>
</svg>
