<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240" font-family="'Segoe UI','Noto Sans Thai',Tahoma,system-ui,sans-serif" role="img" aria-labelledby="fa-title fa-desc">
  <title id="fa-title">Fan Affan builds AI agents</title>
  <desc id="fa-desc">Ink-plate masthead: Fan Affan, Bangkok. Display line Builds AI agents with a blinking caret, a sub-line about systems that work while he sleeps, an orbit mark of three agent nodes around a core, and a data strip listing stack, focus, shipping cadence and status.</desc>
  <!--
    Fan Affan — profile masthead v5 "ink plate / press proof"
    Brief: one committed idea, decoration volume zero | Tier: PREMIUM | Mode: image-source
    Register: print plate, NOT terminal, NOT editorial. Reference: press color bar + crop marks.
    Tokens: plate #151A21 (fixed, both themes) / type #F3F5F7 / sub #B6BEC9 / muted #7D8791
            hairline #2A313B / accent #D61723
    Motion contract: hero = caret blink (steps). Subordinate = underline draw (one-shot entrance).
    Static pose = caret visible, underline complete. Fixed plate reads on light and dark GitHub.
    Honors prefers-reduced-motion. No external fonts, no scripts.
  -->
  <style>
    :root { --fa-duration: 800ms; --fa-easing: cubic-bezier(.22,1,.36,1); --fa-blink: 1100ms; }
    .fa-caret { animation: fa-blink var(--fa-blink) steps(1,end) infinite; }
    .fa-underline {
      stroke: #D61723; stroke-width: 4; stroke-linecap: butt;
      stroke-dasharray: 380; stroke-dashoffset: 380;
      animation: fa-draw var(--fa-duration) var(--fa-easing) 200ms forwards;
    }
    @keyframes fa-blink { 50% { opacity: 0; } }
    @keyframes fa-draw  { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fa-caret { animation: none; }
      .fa-underline { stroke-dashoffset: 0; animation: none; }
    }
  </style>

  <!-- plate -->
  <rect width="940" height="240" fill="#151A21"/>

  <rect class="fa-caret" x="578" y="82" width="14" height="52" fill="#D61723"/>
  <g stroke="#D61723" stroke-width="2">
    <path d="M20 34 V20 H34" fill="none"/>
    <path d="M906 20 H920 V34" fill="none"/>
    <path d="M20 206 V220 H34" fill="none"/>
    <path d="M906 220 H920 V206" fill="none"/>
  </g>

  <!-- label -->
  <text x="48" y="54" font-family="Consolas,Menlo,monospace" font-size="11" letter-spacing="3" fill="#7D8791">FAN AFFAN · BANGKOK · UTC+7</text>

  <!-- display lockup -->
  <text x="44" y="130" font-size="68" font-weight="900" letter-spacing="-1.5" fill="#F3F5F7">Builds AI agents</text>
  <g>
    <circle cx="812" cy="112" r="62" fill="none" stroke="#2A313B" stroke-width="1.5"/>
    <rect x="803" y="41" width="18" height="18" fill="#D61723"/>
    <rect x="857" y="134" width="18" height="18" fill="#D61723"/>
    <rect x="749" y="134" width="18" height="18" fill="#D61723"/>
    <rect x="802" y="102" width="20" height="20" fill="#F3F5F7"/>
    <rect x="808" y="108" width="8" height="8" fill="#D61723"/>
  </g>

  <!-- data strip -->
  <line x1="48" y1="200" x2="892" y2="200" stroke="#2A313B" stroke-width="1"/>
  <g font-family="Consolas,Menlo,monospace" font-size="11" fill="#7D8791" letter-spacing="1">
    <text x="48"  y="222"><tspan fill="#B6BEC9">STACK</tspan>  TypeScript · Python · Node</text>
    <text x="360" y="222"><tspan fill="#B6BEC9">FOCUS</tspan>  skills · MCP · automation</text>
    <text x="640" y="222"><tspan fill="#B6BEC9">SHIP</tspan>  daily since 2023</text>
    <text x="800" y="222"><tspan fill="#D61723">● </tspan><tspan fill="#B6BEC9">open to work</tspan></text>
  </g>
</svg>
